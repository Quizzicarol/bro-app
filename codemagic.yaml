# Codemagic CI/CD Configuration for Bro App
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
# NOTE: Codemagic environment groups must include ADMIN_PUBKEY
#       in the bro_secrets group for admin login.

workflows:
  # ============================================
  # BUILD COMPLETO - Android + iOS
  # ============================================
  full-release:
    name: Android + iOS (Testers)
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Cache acelera MUITO os builds repetidos (pub/gradle/pods). Seguro:
    # pub get e pod install validam/atualizam o que estiver em cache.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/ios/Pods
    
    integrations:
      app_store_connect: Bro App
      
    environment:
      groups:
        - bro_secrets
      android_signing:
        - bro_keystore_v2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.brostr
      flutter: 3.35.7
      xcode: latest
      cocoapods: default
      java: 17
      
    triggering:
      events:
        - push
      branch_patterns:
        # release/* agora dispara SOMENTE o workflow ios-testers (iOS/TestFlight).
        # Mantido aqui apenas main/master para o build completo Android + iOS.
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
      
    scripts:
      - name: Generate env.json from CI variables
        script: printf '{"BREEZ_API_KEY":"%s","PLATFORM_LIGHTNING_ADDRESS":"%s","BACKEND_URL":"%s","ADMIN_PUBKEY":"%s"}' "$BREEZ_API_KEY" "$PLATFORM_LIGHTNING_ADDRESS" "$BACKEND_URL" "$ADMIN_PUBKEY" > "$CM_BUILD_DIR/env.json"

      - name: Decode google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/android/app/google-services.json"

      - name: Get Flutter packages
        # v692: o cache de pub revive clones git MORTOS (breez-sdk-liquid-flutter saiu do ar -> pub get quebrava no CI 03/11). Remover antes de resolver.
        script: rm -rf "$HOME/.pub-cache/git/breez-sdk-liquid-flutter"* 2>/dev/null; flutter pub get
        
      - name: Race test suite - GATE de release (24 testes)
        # v778: nenhum release sai sem a bateria de corrida verde (regra da casa:
        # teste so conta quando roda no CI). Falha aqui ABORTA o build antes de
        # assinar/publicar qualquer coisa (APK, TestFlight, Zapstore).
        script: flutter test test/race test/integration --reporter expanded

      - name: Neutralize breez spark passkey (unused; breaks CocoaPods)
        script: |
          set -e
          # Bro uses mnemonic (BIP-39) seeds, not passkeys. The breez_sdk_spark_flutter
          # 0.19.2 passkey plugin only compiles under SwiftPM; under CocoaPods it fails
          # (missing PasskeyPRFHelperObjC module + optional-unwrap errors). Replace the
          # passkey Swift files with a build-time stub that keeps plugin registration
          # (pluginClass BreezSdkSparkPasskeyPlugin) valid. Runs after each pub-cache clone.
          STUB="$CM_BUILD_DIR/ios/patches/BreezSdkSparkPasskeyPlugin.swift"
          count=0
          for d in "$HOME/.pub-cache/git/breez-sdk-spark-flutter-"*/ios/Classes; do
            [ -d "$d" ] || continue
            if [ -f "$d/BreezSdkSparkPasskeyPlugin.swift" ]; then
              echo "Stubbing passkey in $d"
              cp "$STUB" "$d/BreezSdkSparkPasskeyPlugin.swift"
              printf '// Build-time stub (unused passkey core).\nimport Foundation\n' > "$d/PasskeyAssertionCore.swift"
              count=$((count+1))
            fi
          done
          echo "passkey stub complete (dirs=$count)"
        
      - name: Build APK Release (Android)
        script: flutter build apk --release --dart-define-from-file=env.json
        
      - name: Publish APK to GitHub Release
        script: |
          set -e
          # Token com escrita no Brostr/bro vem do grupo "Brostr" (variavel Brostr),
          # sobrepondo o GH_TOKEN antigo (bro_secrets, so leitura).
          if [ -n "$Brostr" ]; then GH_TOKEN="$Brostr"; export GH_TOKEN; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️  GH_TOKEN not set in bro_secrets — skipping GitHub release."
            exit 0
          fi
          # Install gh CLI if missing
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi
          REPO="Brostr/bro"
          # Validar o token ANTES de publicar. Se estiver inválido/expirado ou
          # sem acesso ao repo, PULAR a publicação com aviso claro em vez de
          # derrubar o build inteiro (os APKs já foram gerados como artefatos).
          export GH_TOKEN
          if ! GH_USER=$(gh api user --jq .login 2>/tmp/gh_err); then
            echo "⚠️  GH_TOKEN inválido/expirado ou sem acesso (HTTP 401)."
            echo "    Detalhe: $(cat /tmp/gh_err)"
            echo "    → Gere um token com permissão Contents: Read and write em $REPO"
            echo "      e atualize GH_TOKEN no grupo bro_secrets do Codemagic."
            echo "⏭️  Pulando publicação no GitHub — build NÃO será marcado como falho."
            exit 0
          fi
          echo "🔑 Autenticado no GitHub como: $GH_USER"
          # Confirmar que o token enxerga o repo alvo (evita 401/404 depois)
          if ! gh api "repos/$REPO" --jq .full_name >/tmp/gh_repo 2>/tmp/gh_err; then
            echo "⚠️  O token '$GH_USER' NÃO tem acesso a $REPO."
            echo "    Detalhe: $(cat /tmp/gh_err)"
            echo "    → Confirme que $GH_USER é colaborador de $REPO e que o token"
            echo "      (fine-grained) inclui esse repositório com Contents: write."
            echo "⏭️  Pulando publicação no GitHub — build NÃO será marcado como falho."
            exit 0
          fi
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v${VERSION}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_LATEST="bro-latest.apk"
          APK_VERSIONED="bro-${TAG}.apk"
          cp "$APK_SRC" "$APK_LATEST"
          cp "$APK_SRC" "$APK_VERSIONED"
          # Build a TRUE arm64-v8a-only APK for Zapstore (~135MB).
          # Universal APK above stays the primary download (bro-latest.apk).
          # MUST use --split-per-abi: --target-platform does NOT strip the
          # other ABIs (Breez/tflite ship .so for all ABIs), so the apk stayed
          # ~289MB. --split-per-abi produces a real per-ABI apk (~135MB).
          # Note: --split-per-abi offsets versionCode (arm64 = 2000+build).
          echo "📦 Building arm64-v8a APK for Zapstore..."
          flutter build apk --release --split-per-abi --dart-define-from-file=env.json
          APK_ARM64="bro-${TAG}-arm64-v8a.apk"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "$APK_ARM64"
          echo "🚀 Publishing $TAG to $REPO..."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading/replacing assets..."
            gh release upload "$TAG" "$APK_LATEST" "$APK_VERSIONED" "$APK_ARM64" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --latest
          else
            gh release create "$TAG" "$APK_LATEST" "$APK_VERSIONED" "$APK_ARM64" \
              --repo "$REPO" \
              --title "Bro $TAG" \
              --notes "Build automático via Codemagic. APK assinado com keystore v2." \
              --latest
          fi
          echo "✅ GitHub release published: https://github.com/$REPO/releases/tag/$TAG"

      - name: Publish to Zapstore
        # Automatiza o que era manual (parou na v133). Requer ZAPSTORE_NSEC no
        # grupo bro_secrets (a nsec da npub14dku... do projeto). Sem a var,
        # pula com aviso sem derrubar o build.
        script: |
          if [ -z "$ZAPSTORE_NSEC" ]; then
            echo "⏭️  ZAPSTORE_NSEC não configurado (grupo bro_secrets) — pulando Zapstore."
            exit 0
          fi
          set -e
          ZSP=/tmp/zsp
          if [ ! -x "$ZSP" ]; then
            # PIN 0.4.17: a 2.0.x (rewrite "agent friendly", nov/2026) falha no
            # darwin com "command is not supported" no comando identity —
            # reproduzido: 2.0.1-linux funciona, 2.0.1-darwin não. 0.4.17
            # testada na VM com p12 e gera a prova (kind 30509) normalmente.
            curl -sSL -o "$ZSP" "https://github.com/zapstore/zsp/releases/download/v0.4.17/zsp-0.4.17-darwin-arm64"
            chmod +x "$ZSP"
          fi
          echo "⚡ Publicando no Zapstore a partir da release do GitHub..."
          # Variáveis NÃO persistem entre steps do Codemagic (cada script é um
          # shell novo) — montar o GITHUB_TOKEN de novo aqui. zsp lê
          # GITHUB_TOKEN (não GH_TOKEN). Token vazio = 401 (erro real 03/11).
          if [ -n "$Brostr" ]; then
            export GITHUB_TOKEN="$Brostr"
          elif [ -n "$GH_TOKEN" ]; then
            export GITHUB_TOKEN="$GH_TOKEN"
          else
            unset GITHUB_TOKEN GH_TOKEN  # repo público: anônimo funciona
          fi
          # NIP-C1: o Zapstore exige prova ATIVA ligando o certificado de
          # assinatura do APK à npub do projeto (erro real 03/11: o proof era
          # do keystore ANTIGO; v2 não tinha prova). Renova a cada build
          # (validade 1 ano, idempotente). CM_KEYSTORE_* vem do grupo de
          # assinatura android do Codemagic.
          echo "🔗 Renovando prova de identidade (cert ↔ npub)..."
          # zsp NÃO lê JKS (erro real: "JKS format not supported" / darwin
          # "command is not supported"). Converte p/ PKCS12 via keytool antes.
          # Diagnóstico explícito: falhar CLARO em vez de mudo.
          echo "   keystore: ${CM_KEYSTORE_PATH:-VAZIO!} | keytool: $(command -v keytool || echo AUSENTE)"
          if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "⚠️ CM_KEYSTORE_PATH ausente — pulando prova de identidade"
          else
            KEY12=/tmp/release_proof.p12
            rm -f "$KEY12"
            keytool -importkeystore -srckeystore "$CM_KEYSTORE_PATH" \
              -destkeystore "$KEY12" -deststoretype PKCS12 \
              -srcstorepass "$CM_KEYSTORE_PASSWORD" -deststorepass "$CM_KEYSTORE_PASSWORD" \
              -noprompt
            if [ ! -s "$KEY12" ]; then
              echo "❌ conversão JKS→PKCS12 falhou (p12 vazio)"; exit 1
            fi
            # O identity PEDE confirmação interativa (TTY) pra publicar — e CI
            # não tem TTY (erro real 03/11). Solução: --offline cospe o evento
            # ASSINADO (a assinatura com nsec funciona sem TTY) e publicamos
            # nós mesmos via websocket.
            SIGN_WITH="$ZAPSTORE_NSEC" KEYSTORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
              "$ZSP" identity --link-key "$KEY12" --link-key-expiry 1y --offline --json > /tmp/proof_event.json
            if [ ! -s /tmp/proof_event.json ]; then
              echo "❌ evento de prova vazio"; exit 1
            fi
            pip3 install --quiet --user websocket-client 2>/dev/null || pip3 install --quiet --break-system-packages websocket-client
            echo "" | base64 -d > /tmp/pub_ev.py
            python3 /tmp/pub_ev.py
          fi
          # v693: `publish -r github...` abre SELETOR INTERATIVO de APK (TTY —
          # erro real 03/11). Publicar PELO CONFIG: o zapstore.yaml já tem
          # `match: arm64-v8a` e o repo — seleção automática, sem TTY.
          # E `--quiet`: no prompts, auto-yes (sem isso o gather-metadata
          # também abre prompt — mesmo erro, uma etapa depois).
          SIGN_WITH="$ZAPSTORE_NSEC" "$ZSP" publish zapstore.yaml --quiet
          echo "✅ Zapstore atualizado"
        
      - name: Decode GoogleService-Info.plist
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          
      - name: Set up iOS code signing
        script: xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS
        # v648: CFBundleVersion elegante e sempre crescente. O App Store ja tem um
        # build com timestamp (1790619223) de quando CM_BUILD_NUMBER estava vazio.
        # Agora: 2000000000 + commits-desde-2026-09-28 — sempre maior que o anterior
        # e sem numero feio de timestamp. agvtool seta direto no Xcode.
        script: |
          # v682: o clone do Codemagic e SHALLOW (depth 50) — sem unshallow o
          # rev-list --count fica travado em 50 e o CFBundleVersion nunca sobe
          # (falha real 28/out: upload rejeitado, versao duplicada 2000000050).
          git fetch --unshallow --quiet 2>/dev/null || git fetch --deepen=500 --quiet 2>/dev/null || true
          COMMITS_TODAY=$(git rev-list --count HEAD --since="2026-09-28 00:00:00")
          BUILD_NUMBER=$(( 2000000000 + COMMITS_TODAY ))
          echo "iOS build number FINAL: $BUILD_NUMBER (commits hoje: $COMMITS_TODAY)"
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"
          cd ..
          flutter build ipa --release --dart-define-from-file=env.json --export-options-plist=/Users/builder/export_options.plist
        
    artifacts:
      - build/**/outputs/**/*.apk
      - build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false # Desabilitado at adicionar screenshots
        # Enviar automaticamente para testadores externos (link pblico)
        # NOTA: Crie o grupo "Beta Pblico" no App Store Connect primeiro!
        # beta_groups:
        # - Beta Pblico
      email:
        recipients:
          - your-email@example.com  # TODO: configure
        notify:
          success: true
          failure: true

  # ============================================
  # iOS APENAS (TestFlight) - para testar entre dispositivos
  # Dispara automaticamente em push para release/*
  # NAO builda APK/Android. NAO envia para a App Store (so TestFlight).
  # ============================================
  ios-testers:
    name: iOS TestFlight (release/*)
    max_build_duration: 90
    instance_type: mac_mini_m2

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

    integrations:
      app_store_connect: Bro App

    environment:
      groups:
        - bro_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.brostr
      flutter: 3.35.7
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true

    scripts:
      - name: Generate env.json from CI variables
        script: printf '{"BREEZ_API_KEY":"%s","PLATFORM_LIGHTNING_ADDRESS":"%s","BACKEND_URL":"%s","ADMIN_PUBKEY":"%s"}' "$BREEZ_API_KEY" "$PLATFORM_LIGHTNING_ADDRESS" "$BACKEND_URL" "$ADMIN_PUBKEY" > "$CM_BUILD_DIR/env.json"

      - name: Decode GoogleService-Info.plist
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Get Flutter packages
        # v692: o cache de pub revive clones git MORTOS (breez-sdk-liquid-flutter saiu do ar -> pub get quebrava no CI 03/11). Remover antes de resolver.
        script: rm -rf "$HOME/.pub-cache/git/breez-sdk-liquid-flutter"* 2>/dev/null; flutter pub get

      - name: Race test suite - GATE de release (24 testes)
        # v778: nenhum release sai sem a bateria de corrida verde (regra da casa:
        # teste so conta quando roda no CI). Falha aqui ABORTA o build antes de
        # assinar/publicar qualquer coisa (APK, TestFlight, Zapstore).
        script: flutter test test/race test/integration --reporter expanded

      - name: Neutralize breez spark passkey (unused; breaks CocoaPods)
        script: |
          set -e
          # Bro uses mnemonic (BIP-39) seeds, not passkeys. The breez_sdk_spark_flutter
          # 0.19.2 passkey plugin only compiles under SwiftPM; under CocoaPods it fails
          # (missing PasskeyPRFHelperObjC module + optional-unwrap errors). Replace the
          # passkey Swift files with a build-time stub that keeps plugin registration
          # (pluginClass BreezSdkSparkPasskeyPlugin) valid. Runs after each pub-cache clone.
          STUB="$CM_BUILD_DIR/ios/patches/BreezSdkSparkPasskeyPlugin.swift"
          count=0
          for d in "$HOME/.pub-cache/git/breez-sdk-spark-flutter-"*/ios/Classes; do
            [ -d "$d" ] || continue
            if [ -f "$d/BreezSdkSparkPasskeyPlugin.swift" ]; then
              echo "Stubbing passkey in $d"
              cp "$STUB" "$d/BreezSdkSparkPasskeyPlugin.swift"
              printf '// Build-time stub (unused passkey core).\nimport Foundation\n' > "$d/PasskeyAssertionCore.swift"
              count=$((count+1))
            fi
          done
          echo "passkey stub complete (dirs=$count)"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up iOS code signing
        script: xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS
        script: |
          git fetch --unshallow --quiet 2>/dev/null || git fetch --deepen=500 --quiet 2>/dev/null || true
          COMMITS_TODAY=$(git rev-list --count HEAD --since="2026-09-28 00:00:00")
          BUILD_NUMBER=$(( 2000000000 + COMMITS_TODAY ))
          echo "iOS build number FINAL: $BUILD_NUMBER (commits hoje: $COMMITS_TODAY)"
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"
          cd ..
          flutter build ipa --release --dart-define-from-file=env.json --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - your-email@example.com  # TODO: configure
        notify:
          success: true
          failure: true

  # ============================================
  # ANDROID APK -> GitHub Release publico (latest)
  # Dispara em push para apk/*  (ex: apk/v628)
  # NAO builda iOS / nao toca no TestFlight. Publica universal + arm64
  # no repo Brostr/bro e marca como latest (fonte do Zapstore).
  # ============================================
  android-public-release:
    name: Android APK -> GitHub Release (latest)
    max_build_duration: 90
    instance_type: mac_mini_m2

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    environment:
      groups:
        - bro_secrets
      android_signing:
        - bro_keystore_v2
      flutter: 3.35.7
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'apk/*'
          include: true

    scripts:
      - name: Generate env.json from CI variables
        script: printf '{"BREEZ_API_KEY":"%s","PLATFORM_LIGHTNING_ADDRESS":"%s","BACKEND_URL":"%s","ADMIN_PUBKEY":"%s"}' "$BREEZ_API_KEY" "$PLATFORM_LIGHTNING_ADDRESS" "$BACKEND_URL" "$ADMIN_PUBKEY" > "$CM_BUILD_DIR/env.json"

      - name: Decode google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/android/app/google-services.json"

      - name: Get Flutter packages
        # v692: o cache de pub revive clones git MORTOS (breez-sdk-liquid-flutter saiu do ar -> pub get quebrava no CI 03/11). Remover antes de resolver.
        script: rm -rf "$HOME/.pub-cache/git/breez-sdk-liquid-flutter"* 2>/dev/null; flutter pub get

      - name: Race test suite - GATE de release (24 testes)
        # v778: nenhum release sai sem a bateria de corrida verde (regra da casa:
        # teste so conta quando roda no CI). Falha aqui ABORTA o build antes de
        # assinar/publicar qualquer coisa (APK, TestFlight, Zapstore).
        script: flutter test test/race test/integration --reporter expanded

      - name: Build APK Release (Android)
        script: flutter build apk --release --dart-define-from-file=env.json

      - name: Publish APK to GitHub Release
        script: |
          set -e
          # Token com escrita no Brostr/bro vem do grupo "Brostr" (variavel Brostr),
          # sobrepondo o GH_TOKEN antigo (bro_secrets, so leitura).
          if [ -n "$Brostr" ]; then GH_TOKEN="$Brostr"; export GH_TOKEN; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️  GH_TOKEN not set in bro_secrets — skipping GitHub release."
            exit 0
          fi
          # Install gh CLI if missing
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi
          REPO="Brostr/bro"
          # Validar o token ANTES de publicar. Se estiver inválido/expirado ou
          # sem acesso ao repo, PULAR a publicação com aviso claro em vez de
          # derrubar o build inteiro (os APKs já foram gerados como artefatos).
          export GH_TOKEN
          if ! GH_USER=$(gh api user --jq .login 2>/tmp/gh_err); then
            echo "⚠️  GH_TOKEN inválido/expirado ou sem acesso (HTTP 401)."
            echo "    Detalhe: $(cat /tmp/gh_err)"
            echo "    → Gere um token com permissão Contents: Read and write em $REPO"
            echo "      e atualize GH_TOKEN no grupo bro_secrets do Codemagic."
            echo "⏭️  Pulando publicação no GitHub — build NÃO será marcado como falho."
            exit 0
          fi
          echo "🔑 Autenticado no GitHub como: $GH_USER"
          # Confirmar que o token enxerga o repo alvo (evita 401/404 depois)
          if ! gh api "repos/$REPO" --jq .full_name >/tmp/gh_repo 2>/tmp/gh_err; then
            echo "⚠️  O token '$GH_USER' NÃO tem acesso a $REPO."
            echo "    Detalhe: $(cat /tmp/gh_err)"
            echo "    → Confirme que $GH_USER é colaborador de $REPO e que o token"
            echo "      (fine-grained) inclui esse repositório com Contents: write."
            echo "⏭️  Pulando publicação no GitHub — build NÃO será marcado como falho."
            exit 0
          fi
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v${VERSION}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_LATEST="bro-latest.apk"
          APK_VERSIONED="bro-${TAG}.apk"
          cp "$APK_SRC" "$APK_LATEST"
          cp "$APK_SRC" "$APK_VERSIONED"
          # Build a TRUE arm64-v8a-only APK for Zapstore (~135MB).
          echo "📦 Building arm64-v8a APK for Zapstore..."
          flutter build apk --release --split-per-abi --dart-define-from-file=env.json
          APK_ARM64="bro-${TAG}-arm64-v8a.apk"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "$APK_ARM64"
          echo "🚀 Publishing $TAG to $REPO..."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading/replacing assets..."
            gh release upload "$TAG" "$APK_LATEST" "$APK_VERSIONED" "$APK_ARM64" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --latest
          else
            gh release create "$TAG" "$APK_LATEST" "$APK_VERSIONED" "$APK_ARM64" \
              --repo "$REPO" \
              --title "Bro $TAG" \
              --notes "Build automático via Codemagic. APK assinado com keystore v2." \
              --latest
          fi
          echo "✅ GitHub release published: https://github.com/$REPO/releases/tag/$TAG"

      - name: Publish to Zapstore
        script: |
          if [ -z "$ZAPSTORE_NSEC" ]; then
            echo "⏭️  ZAPSTORE_NSEC não configurado (grupo bro_secrets) — pulando Zapstore."
            exit 0
          fi
          set -e
          ZSP=/tmp/zsp
          if [ ! -x "$ZSP" ]; then
            curl -sSL -o "$ZSP" "https://github.com/zapstore/zsp/releases/download/v0.4.17/zsp-0.4.17-darwin-arm64"
            chmod +x "$ZSP"
          fi
          echo "⚡ Publicando no Zapstore a partir da release do GitHub..."
          if [ -n "$Brostr" ]; then
            export GITHUB_TOKEN="$Brostr"
          elif [ -n "$GH_TOKEN" ]; then
            export GITHUB_TOKEN="$GH_TOKEN"
          else
            unset GITHUB_TOKEN GH_TOKEN
          fi
          echo "🔗 Renovando prova de identidade (cert ↔ npub)..."
          echo "   keystore: ${CM_KEYSTORE_PATH:-VAZIO!} | keytool: $(command -v keytool || echo AUSENTE)"
          if [ -n "$CM_KEYSTORE_PATH" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            KEY12=/tmp/release_proof.p12
            rm -f "$KEY12"
            keytool -importkeystore -srckeystore "$CM_KEYSTORE_PATH" \
              -destkeystore "$KEY12" -deststoretype PKCS12 \
              -srcstorepass "$CM_KEYSTORE_PASSWORD" -deststorepass "$CM_KEYSTORE_PASSWORD" \
              -noprompt
            if [ ! -s "$KEY12" ]; then
              echo "❌ conversão JKS→PKCS12 falhou (p12 vazio)"; exit 1
            fi
            SIGN_WITH="$ZAPSTORE_NSEC" KEYSTORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
              "$ZSP" identity --link-key "$KEY12" --link-key-expiry 1y --offline --json > /tmp/proof_event.json
            if [ ! -s /tmp/proof_event.json ]; then
              echo "❌ evento de prova vazio"; exit 1
            fi
            pip3 install --quiet --user websocket-client 2>/dev/null || pip3 install --quiet --break-system-packages websocket-client
            echo "" | base64 -d > /tmp/pub_ev.py
            python3 /tmp/pub_ev.py
          fi
          SIGN_WITH="$ZAPSTORE_NSEC" "$ZSP" publish zapstore.yaml --quiet
          echo "✅ Zapstore atualizado"

    artifacts:
      - build/**/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com  # TODO: configure
        notify:
          success: true
          failure: true

