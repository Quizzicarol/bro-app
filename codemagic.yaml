  # ============================================
  # BACKEND -> Fly.io (bro-api)
  # Dispara quando algo em backend/ muda. Deploya o servidor Node no Fly.io
  # sem depender da máquina local (o antivírus local apagava o flyctl).
  # Requer FLY_API_TOKEN no grupo de segredos (Personal/Org access token).
  # ============================================
  backend-deploy-flyio:
    name: Backend -> Fly.io (bro-api)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      groups:
        - bro_secrets

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true

    scripts:
      - name: Install flyctl
        script: |
          curl -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl version

      - name: Deploy backend to Fly.io
        script: |
          export PATH="$HOME/.fly/bin:$PATH"
          # v658: limpeza AGRESSIVA do token. Além de espaços/quebras de linha,
          # copiar/colar do dashboard pode trazer caracteres invisíveis (BOM,
          # zero-width space, non-breaking space) que quebram a validação do
          # macaroon. Removemos TUDO que não é caractere imprimível.
          FLY_API_TOKEN="$(printf '%s' "$FLY_API_TOKEN" | LC_ALL=C tr -cd '[:graph:]')"
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "⚠️  FLY_API_TOKEN não configurado no grupo bro_secrets — pulando deploy."
            exit 0
          fi
          echo "🔑 FLY_API_TOKEN presente (${#FLY_API_TOKEN} chars, prefixo ${FLY_API_TOKEN:0:5}...)"
          # Validar o token ANTES de tentar o deploy — falha clara se inválido.
          export FLY_ACCESS_TOKEN="$FLY_API_TOKEN"
          echo "🔎 Validando token com 'flyctl auth whoami'..."
          if ! flyctl auth whoami --access-token "$FLY_API_TOKEN"; then
            echo "❌ Token INVÁLIDO ou sem permissão. Gere um novo em:"
            echo "   Fly dashboard → org 'Personal' → Tokens → 'Create Organization Token'"
            echo "   e atualize FLY_API_TOKEN no Codemagic (grupo bro_secrets)."
            exit 1
          fi
          echo "✅ Token válido — iniciando deploy"
          flyctl deploy -a bro-api --config backend/fly.toml --dockerfile backend/Dockerfile --remote-only --access-token "$FLY_API_TOKEN"

  # ============================================
  # RACE TEST SUITE (rapido, sem build nativo)
  # v778: feedback em TODO push (main, develop, feature/*, release/*).
  # Nao substitui o gate dentro dos workflows de release - roda de novo la.
  # Usa mocks (test/fixtures/) - nao precisa de segredos nem env.json.
